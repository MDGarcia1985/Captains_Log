    commit_breakpoint: P03_secure_storage

  - id: P04
    name: Archive encryption architecture implementation
    objective: Layered AEK hierarchy, SQLCipher, AES-GCM per-object DEKs, plaintext migration.
    prerequisites: [P03, D15, D28]
    do_not_start_until_p01_unblocked: false
