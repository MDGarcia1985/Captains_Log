# ---------------------------------------------------------------------------
# Beta gate. Encrypted local archive, first-delivery auth methods, and recovery
# are required before security/beta. Apple, phone, iOS hardware, wearables, and
# SDK 58 are not.
# ---------------------------------------------------------------------------
beta_gate:
  security_phase: P29
  android_beta_phase: P30
  requires_archive_encryption: P04
  requires_first_delivery_authentication:
    google: P08
    passkey: P10
    totp: P12
    verified_email: P13
  requires_recovery: P14
  also_required_before_security_pass:
    - P15
    - P16
    - P17
    - P27
    - P28
  not_required_for_android_beta:
    - apple
    - phone
    - P18_provider_discovery_ux
    - P31_ios
    - P32_wearables
    - P33_sdk_58
  p04_is_not_evidence_of_p14: true
  p14_is_not_evidence_of_p04: true
  note: >
    P04 implements encrypted local persistence required by D2 and D15.
    P14 implements recovery of that encrypted archive. Authentication
    completion without P04 is insufficient for beta. P29 and P30 are not
    reachable unless P04 is complete and verified.

# ---------------------------------------------------------------------------
# Phase line. Prefer more verified breakpoints over giant commits.
# ---------------------------------------------------------------------------
phases:
  - id: P00
    name: Authoritative YAML and schema audit
    objective: Create this contract, record schema evidence, accept D1–D30, rebuild the phase line.
    prerequisites: []
    architecture_introduced:
      - this_document
      - independent_schema_namespaces
    files_expected_to_change:
      - docs/ACCOUNT_IDENTITY.yaml
      - docs/planning/ACCOUNT_AUTHENTICATION_PLAN_2026-09-20.md
      - docs/DEVNOTES.md
      - docs/TEST_LOG.md
      - docs/captains-log.yaml
      - docs/ARCHITECTURE.md
      - scripts/account-identity-yaml-smoke.ts
      - package.json
    schemas_affected:
      - account_identity
    external_resources_required: []
    secrets_required: []
    security_properties:
      - documentation_cannot_claim_sqlite_schema_3
      - identity_layers_are_named_and_distinct
    automated_tests:
      - scripts/account-identity-yaml-smoke.ts
    device_tests: []
    success_criteria:
      - yaml_parses
      - schema_versions_match_repository_evidence
      - d1_d12_are_approved
    rollback_condition: delete_or_revert_this_documentation_set
    explicit_non_goals:
      - native_google
      - encryption_implementation
      - authority_deployment
    commit_breakpoint: P00_yaml_contract

  - id: P01
    name: Identity TypeScript contracts
    objective: Add token-free account, auth, grant, and error types that match this YAML.
    prerequisites: [P00]
    architecture_review_hold: released
    blocked_until: null
    architecture_introduced:
      - src/models/account.ts
      - src/models/auth.ts
      - src/models/authorization.ts
      - src/utilities/authErrors.ts
    files_expected_to_change:
      - src/models/account.ts
      - src/models/auth.ts
      - src/models/authorization.ts
      - src/utilities/authErrors.ts
      - src/models/types.ts
      - src/models/contracts.ts
      - scripts/account-identity-contract-smoke.ts
    schemas_affected:
      - account_identity
    external_resources_required: []
    secrets_required: []
    security_properties:
      - UI contracts contain no credentials
      - UUID possession is typed as non-authorizing
    automated_tests:
      - npm run typecheck
      - scripts/account-identity-contract-smoke.ts
    device_tests: []
    success_criteria:
      - types_compile
      - no_token_fields_on_ui_contracts
    rollback_condition: remove_new_model_files_and_revert_type_imports
    explicit_non_goals:
      - service_rewrites
      - native_modules
      - dockerfile
      - live_aws_resources
    commit_breakpoint: P01_identity_contracts

  - id: P02
    name: Local profile and archive identity metadata
    objective: Create local_profile_uuid and archive_uuid without requiring a remote account.
    prerequisites: [P01]
    architecture_introduced:
      - local_profile
      - archive_uuid_metadata
    files_expected_to_change:
      - src/services/archiveAccessService.ts
      - src/adapters/auth/installIdentity.ts
      - src/services/AppServicesProvider.tsx
    schemas_affected:
      - account_identity
      - secure_record
    external_resources_required: []
    secrets_required: []
    security_properties:
      - first_launch_works_offline
      - restored_metadata_is_not_auth_proof
    automated_tests:
      - node_smoke_for_uuid_creation_and_restore_nonproof
    device_tests:
      - offline_first_launch_android
    success_criteria:
      - clean_install_creates_profile_and_archive_uuids_without_network
    rollback_condition: revert_metadata_writers_preserve_existing_sqlite
    explicit_non_goals:
      - sqlcipher
      - google
    commit_breakpoint: P02_local_identity

  - id: P03
    name: Secure storage isolation and legacy credential invalidation
    objective: Native-only secret storage, install marker, reject legacy Google/Drive tokens.
    prerequisites: [P02]
    architecture_introduced:
      - secure_record
      - install_marker
    files_expected_to_change:
      - src/utilities/secureKv.ts
      - src/adapters/auth/authStorage.ts
      - src/adapters/auth/googleAuthProvider.ts
      - src/adapters/googleDrive/googleDriveBackupProvider.ts
      - src/services/authService.ts
    schemas_affected:
