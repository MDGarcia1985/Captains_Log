# ---------------------------------------------------------------------------
# Schema namespaces. Do not reuse one schema_version across unrelated systems.
# ---------------------------------------------------------------------------
schemas:
  database:
    name: sqlite_archive
    version: 2
    field: PRAGMA user_version
    constant: DATABASE_VERSION
    evidence:
      - src/adapters/sqlite/schema.ts DATABASE_VERSION = 2
      - src/adapters/sqlite/database.ts migrate() advances only to user_version 2
      - src/adapters/sqlite/migrations.ts migrateV1 then migrateV2; no migrateV3
    schema_3_is_not_this: true
    increment_when: additive or breaking SQLite table/column/index changes
    does_not_increment:
      - account_identity
      - graph
      - ui
      - sync_protocol
      - sharing_protocol

  account_identity:
    version: 1
    increment_when: account, identity, factor, grant, device, or session contracts change

  graph:
    version: 1
    status: implicit_current_contract
    evidence:
      - docs/captains-log.yaml knowledge_graph entity_types and relationships
      - src/models/types.ts ENTITY_TYPES and RELATIONSHIP_TYPES
      - no independent graph schema_version field exists in the repository
    increment_when: entity types, relationship types, or provenance rules change
    may_require_database_migration: true
    does_not_follow_database_version_automatically: true

  ui:
    manifest:
      version: 1
      evidence:
        - src/ui/ui.yaml ui.version: 1
    layout_generator:
      schema_version: 3
      evidence:
        - src/ui/yaml_layout/mobile/mobile.yaml family.schema_version: 3
        - src/ui/generated/uiSpec.ts schema_version: 3
        - docs/DEVNOTES.md DEV-2026-09-18-001 TASK-007 schema 3 resolver
      note: >
        The concern that "schema 3" might be SQLite version 3 is resolved.
        Schema 3 is the HUD layout generator contract, not persistence.
    credentials_forbidden: true

  backup_snapshot:
    version: 1
    evidence:
      - src/adapters/googleDrive/googleDriveBackupProvider.ts SnapshotManifest.schemaVersion: 1
    increment_when: Drive snapshot manifest or snapshot payload layout changes
    distinct_from: sync_protocol

  sync_protocol:
    version: 1
    status: specified_not_implemented
    increment_when: object sync message format, versioning, or conflict rules change

  sharing_protocol:
    version: 1
    status: specified_not_implemented
    increment_when: local or cloud sharing authorization or transfer format changes

  secure_record:
    version: 1
    status: specified_not_implemented
    store: expo-secure-store_native_only
    increment_when: local secure metadata envelope format changes

  authority_api:
    version: 1
    status: specified_not_implemented
    increment_when: Captain's Log authority HTTP/JSON contracts change

  authority_persistence:
    version: 1
    status: specified_not_implemented
    distinct_from: sqlite_archive
    note: Authority data never lives in captains-log.db.

