# TASK-007 relational YAML proposal; generator/runtime migration intentionally deferred.
# Collapsed parent, bezel, handle, and expanded assembly are distinct. Internal artwork stays native size.
component:
  id: action_dock
  behavior:
    default_visibility: collapsed
    expanded: visible
    collapsed: hidden
    viewport_space: overlay
    handle: action_dock_handle
    transition:
      type: assembled_slide
      duration_ms: 240
      easing: cubic_out
      handle_anchor: above_bezel_top
      clip_boundary: collapsed_handle_bottom
  sizing: fixed
  placement_owner: orientation
  collapsed_parent:
    role: collapsed_envelope
    width: 363.262
    height: 115.277
    sizing: fixed
  bezel:
    role: visible_bezel
    width: 350
    height: 96
    sizing: fixed
    scale_to_expanded_height: false
  handle:
    role: dock_handle
    width: 77.5
    height: 27.5
    sizing: fixed
    scale_to_expanded_height: false
  expanded_assembly:
    contain_in: viewport
    include_handle: true
    handle_anchor: above_bezel_top
    overlap_with_bezel: 0
    height: 123.5
    height_canonical: true
    height_basis: handle 27.5 + bezel 96
    width: 363.262
    width_role: collapsed_parent_width
    scale_internal_artwork: false
  size_role: collapsed_parent_envelope
  size:
    width: 363.262
    height: 115.277
  reference_geometry:
    parent_bounds:
      x: 0
      y: 0
      width: 363.2619323730469
      height: 115.27710723876953
    bezel_bounds:
      x: 0
      y: 0
      width: 350
      height: 96
    handle_bounds:
      width: 77.5
      height: 27.5
    expanded_assembly_height: 123.5
  bezel_layout:
    sizing: fixed
    width: 350
    height: 96
    alignment:
      horizontal: left
      vertical: top
    scale_to_expanded_height: false
  controls:
    sizing: fixed
    scale: 1
    scale_to_expanded_height: false
  spacing:
    axis: horizontal
    leading:
      min: 7
      preferred: 7
      max: 7
    trailing:
      min: 26.262
      preferred: 26.262
      max: 26.262
    gap:
      min: 14
      preferred: 14
      max: 14
    sequence:
      - preserve_controls
      - contract_gaps
      - unsupported_size
