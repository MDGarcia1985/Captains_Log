# TASK-007 relational YAML proposal; generator/runtime migration intentionally deferred.
# The Figma frame is the bezel. The handle hangs above it and overlaps the top by 2.5.
component:
  id: action_dock
  behavior:
    default_visibility: collapsed
    expanded: visible
    collapsed: hidden
    viewport_space: overlay
    handle: action_dock_handle
    transition:
      type: assembled_slide
      duration_ms: 240
      easing: cubic_out
      handle_anchor: above_bezel_top
      clip_boundary: collapsed_handle_bottom
  sizing: fixed
  placement_owner: orientation
  collapsed_parent:
    role: visible_bezel
    width: 350
    height: 96
    sizing: fixed
  bezel:
    role: visible_bezel
    width: 350
    height: 96
    sizing: fixed
    scale_to_expanded_height: false
  handle:
    role: dock_handle
    width: 77.5
    height: 27.5
    sizing: fixed
    scale_to_expanded_height: false
  expanded_assembly:
    contain_in: viewport
    include_handle: true
    handle_anchor: above_bezel_top
    overlap_with_bezel: 2.5
    height: 121
    height_canonical: true
    height_basis: handle 27.5 + bezel 96 - overlap 2.5
    width: 350
    width_role: bezel_width
    scale_internal_artwork: false
  size_role: visible_bezel
  size:
    width: 350
    height: 96
  reference_geometry:
    parent_bounds:
      x: 0
      y: 0
      width: 350
      height: 96
    bezel_bounds:
      x: 0
      y: 0
      width: 350
      height: 96
    handle_bounds:
      x: 136
      y: -25
      width: 77.5
      height: 27.5
    expanded_assembly_height: 121
  bezel_layout:
    sizing: fixed
    width: 350
    height: 96
    alignment:
      horizontal: left
      vertical: top
    scale_to_expanded_height: false
  controls:
    sizing: fixed
    scale: 1
    scale_to_expanded_height: false
  spacing:
    axis: horizontal
    leading:
      min: 10
      preferred: 10
      max: 10
    trailing:
      min: 10
      preferred: 10
      max: 10
    gap:
      min: 14
      preferred: 14
      max: 14
    sequence:
      - preserve_controls
      - contract_gaps
      - unsupported_size
